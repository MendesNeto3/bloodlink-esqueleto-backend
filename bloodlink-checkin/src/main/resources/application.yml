server:
  port: 8083

spring:
  application:
    name: bloodlink-checkin
  # só valida JWT; sem isso o Spring gera um usuário padrão com senha aleatória
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/bloodlink
    username: bloodlink
    password: dev_only
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        # as instâncias do resolver e do provider vêm do bloodlink-tenant-starter
        multiTenancy: SCHEMA
  flyway:
    enabled: false # a tabela checkin é criada pelas migrations tenant da API (V11)
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
        default-requeue-rejected: false

bloodlink:
  jwt:
    # o mesmo segredo do Auth e da API
    segredo: ${BLOODLINK_JWT_SEGREDO}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never # não vazar detalhes de infra numa rota pública