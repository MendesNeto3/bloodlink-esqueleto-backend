server:
  port: 8082

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:dev_only}
      timeout: 500ms          # comando lento ou Redis fora: o cache vira "miss" e a requisição segue
      connect-timeout: 1s
  application:
    name: bloodlink-estoque
  # só valida JWT; sem isso o Spring gera um usuário padrão com senha aleatória
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/bloodlink
    username: bloodlink
    password: dev_only
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        # as instâncias do resolver e do provider vêm do bloodlink-tenant-starter
        multiTenancy: SCHEMA
  flyway:
    enabled: false # as tabelas deste serviço são criadas pelas migrations tenant da API (V10)
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # o Estoque só publica: sem broker, a baixa não pode ficar presa esperando conexão
    connection-timeout: 2s

bloodlink:
  jwt:
    # o mesmo segredo do Auth e da API
    segredo: ${BLOODLINK_JWT_SEGREDO}
  estoque:
    validade-padrao-dias: 42
    validade-maxima-dias: 365 # teto da validade, contado a partir da coleta
    dias-alerta-vencimento: 7 # janela do "vencendo em breve" no resumo
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never # não vazar detalhes de infra numa rota pública
  health:
    redis:
      enabled: false   # o Redis é só cache/limite e o sistema funciona sem ele; não derruba o health