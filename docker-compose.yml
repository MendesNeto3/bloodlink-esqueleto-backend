# Este compose sobe só a INFRA (Postgres, RabbitMQ, MailHog, Redis, MinIO). Os 6 serviços
# Java (gateway, api, estoque, checkin, centro, notificacao) rodam via
# "mvn spring-boot:run" em processos separados durante o desenvolvimento —
# ver README.md pras portas de cada um.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bloodlink
      POSTGRES_USER: bloodlink
      POSTGRES_PASSWORD: dev_only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672" # painel: http://localhost:15672 (guest/guest)

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025" # caixa de entrada: http://localhost:8025

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "dev_only"]
    ports:
      - "6379:6379"

  # Arquivos dos documentos (compatível com S3). Console: http://localhost:9001 (bloodlink / bloodlink_dev_only)
  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: bloodlink
      MINIO_ROOT_PASSWORD: bloodlink_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # roda uma vez: cria o bucket e termina
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 bloodlink bloodlink_dev_only; do sleep 1; done;
      mc mb --ignore-existing local/bloodlink-documentos; exit 0"

  # Antivírus dos documentos (opcional): docker compose --profile antivirus up -d clamav
  # Demora alguns minutos para baixar as assinaturas e usa cerca de 1 GB de memória.
  # Depois, ligue com BLOODLINK_ANTIVIRUS_HABILITADO=true.
  clamav:
    image: clamav/clamav:stable
    profiles: ["antivirus"]
    ports:
      - "3310:3310"

volumes:
  pgdata:
  miniodata:
